name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "scripts/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate gallery image list
        run: node scripts/generate-gallery-manifest.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIDYA_SETU_EDUCATION }}
          projectId: vidya-setu-education
          channelId: live
