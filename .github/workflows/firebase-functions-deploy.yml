name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_FUNCTIONS_SERVICE_ACCOUNT_VIDYA_SETU_EDUCATION }}

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Configure BigQuery dataset
        run: echo "BIGQUERY_DATASET=vse_bq_dataset" > functions/.env.vidya-setu-education

      - name: Deploy Cloud Functions
        run: npx --yes firebase-tools deploy --only functions --project vidya-setu-education --non-interactive
